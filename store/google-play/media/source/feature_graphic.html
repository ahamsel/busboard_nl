<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Figtree;font-weight:800;src:url(../../../../assets/fonts/Figtree-ExtraBold.ttf)}
@font-face{font-family:Figtree;font-weight:600;src:url(../../../../assets/fonts/Figtree-SemiBold.ttf)}
@font-face{font-family:Figtree;font-weight:500;src:url(../../../../assets/fonts/Figtree-Medium.ttf)}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:#1272C9;font-family:Figtree;color:#FFFFFF;position:relative}
.glow{position:absolute;right:-120px;top:-160px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16) 0,rgba(255,255,255,0) 65%)}
.shade{position:absolute;left:-200px;bottom:-420px;width:760px;height:760px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,0,0,.18) 0,rgba(0,0,0,0) 65%)}
.route{position:absolute;left:0;right:0;bottom:64px;height:0}
.copy{position:absolute;left:64px;top:80px;width:480px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:84px;height:84px;border-radius:20px;background:#1272C9;box-shadow:0 0 0 2px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.22)}
h1{margin:0;font-weight:800;font-size:58px;letter-spacing:-1px;line-height:1}
.tag{margin:34px 0 0;font-weight:800;font-size:38px;line-height:1.12;letter-spacing:-.4px}
.sub{margin:16px 0 0;font-weight:500;font-size:20px;line-height:1.35;color:rgba(255,255,255,.88)}
.badges{display:flex;gap:8px;margin-top:26px}
.b{min-width:30px;height:28px;padding:0 6px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:#16181C;box-sizing:border-box}
.phone{position:absolute;width:200px;height:400px;border-radius:34px;background:#16181C;padding:7px;box-sizing:border-box;
  box-shadow:0 22px 50px rgba(0,0,0,.34)}
.phone img{width:100%;height:100%;border-radius:28px;object-fit:cover;object-position:top;display:block}
.p1{left:588px;top:50px;transform:rotate(-4deg)}
.p2{left:770px;top:60px;transform:rotate(5deg)}
</style></head><body>
<div class="glow"></div><div class="shade"></div>
<div class="copy">
  <div class="brand"><img src="../../../../assets/brand/busboard_icon.svg"><h1>BusBoard NL</h1></div>
  <p class="tag">Your stop's next buses,<br>live, at a glance.</p>
  <p class="sub">A board for your stop, a live map, trip planning and alerts for Metrobus in St. John's.</p>
  <div class="badges">
    <span class="b" style="background:#FFD9B8">1</span><span class="b" style="background:#FFC9C2">2</span>
    <span class="b" style="background:#CFEEDB">10</span><span class="b" style="background:#FBE7A6">16</span>
    <span class="b" style="background:#E2F0B0">23</span><span class="b" style="background:#CFE3FA">29</span>
  </div>
</div>
<div class="phone p2"><img src="../en-US/images/phoneScreenshots/02-map.png"></div>
<div class="phone p1"><img src="../en-US/images/phoneScreenshots/01-board.png"></div>
</body></html>
