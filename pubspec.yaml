name: busboard_nl
description: "BusBoard NL - Personalized arrival board for Metrobus St. John's, NL"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^4.0.7
  collection: ^1.19.1
  csv: ^7.1.0
  flutter_riverpod: ^3.2.1
  geolocator: ^14.0.2
  go_router: ^17.1.0
  http: ^1.6.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  maplibre_gl: ^0.25.0
  shared_preferences: ^2.5.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.29.0
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0277BD"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#0277BD"
  background_image: "assets/icon/splash_background.png"
  image: "assets/icon/app_icon_nobg.png"
  
  android_12:
    image: "assets/icon/app_icon_nobg.png"
    icon_background_color: "#0277BD"

flutter:
  uses-material-design: true
