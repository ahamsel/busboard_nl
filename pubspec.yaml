name: busboard_nl
description: "BusBoard NL - Personalized arrival board for Metrobus St. John's, NL"
publish_to: 'none'
version: 1.3.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  archive: ^4.0.7
  collection: ^1.19.1
  csv: ^8.0.0
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.2.1
  geolocator: ^14.0.2
  go_router: ^18.0.2
  gtfs_realtime_bindings: ^1.2.0
  http: ^1.6.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  maplibre_gl: ^0.27.1
  shared_preferences: ^2.5.4
  timezone: ^0.11.1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  fixnum: ^1.1.1
  geolocator_platform_interface: ^4.4.0
  flutter_lints: ^6.0.0
  test: ^1.29.0
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3E7CB1"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#3E7CB1"
  image: "assets/icon/splash_logo.png"
  android_12:
    image: "assets/icon/splash_logo_android12.png"
    icon_background_color: "#3E7CB1"

flutter:
  uses-material-design: true
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    # Phosphor icons (MIT), the two weights bb_icons.dart uses.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
  assets:
    # Figtree's OFL text, shown on the licence page (see lib/app_licenses.dart).
    - assets/fonts/OFL.txt
    # Phosphor's MIT licence text, same page.
    - assets/fonts/phosphor/LICENSE.txt
    # Harbour map styles, generated by tool/build_map_styles.dart (spec §3.1).
    - assets/map/
