publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  archive: ^4.0.7
  collection: ^1.19.1
  csv: ^7.1.0
  flutter_riverpod: ^3.2.1
  geolocator: ^14.0.2
  go_router: ^17.1.0
  http: ^1.6.0
  intl: ^0.20.2
  path_provider: ^2.1.5
  maplibre_gl: ^0.25.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.29.0
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
